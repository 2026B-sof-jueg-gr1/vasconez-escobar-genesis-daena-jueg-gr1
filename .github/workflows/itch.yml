name: Publicar en itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  butler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V
      - name: Subir el juego a itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: ./butler push juego daena06/tres-regiones-tierra-en-ruinas:html5 --userversion ${{ github.sha }}
